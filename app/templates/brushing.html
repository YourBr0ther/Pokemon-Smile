<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brushing - Pokémon Smile</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  
  {% include 'common_head.html' %}
  <style>
    /* Layout containers */
    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #4682B4 100%);
      display: grid;
      grid-template-rows: 100px 1fr 150px;
      grid-template-columns: 1fr;
      grid-template-areas: 
        "top"
        "main"
        "bottom";
    }

    /* Top bar elements */
    .top-bar {
      position: relative;
      grid-area: top;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 10px 20px;
      align-items: center;
      z-index: 1000;
    }

    .camera-container {
      width: 240px;
      height: 180px;
      border: 4px solid white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #000;
      justify-self: start;
    }

    .timer {
      font-size: 48px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 30px;
      border-radius: 25px;
      justify-self: center;
    }

    .pause-button {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      justify-self: end;
    }

    .pause-button i {
      font-size: 24px;
      color: #333;
    }

    /* Forest scene - main area */
    .forest-scene {
      position: relative;
      grid-area: main;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
    }

    .terrain-layer {
      position: absolute;
      width: 100%;
      height: 40%;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
    }

    .layer-1 { bottom: 25%; }
    .layer-2 { bottom: 15%; }
    .layer-3 { bottom: 10%; }

    .terrain {
      position: relative;
      width: 33%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .terrain::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, 
        rgba(45, 90, 39, 0.8) 0%,
        rgba(29, 79, 31, 0.9) 50%,
        rgba(29, 79, 31, 1) 100%
      );
      border-radius: 50% 50% 0 0;
    }

    .terrain::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      bottom: 0;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0) 70%
      );
      border-radius: 50% 50% 0 0;
    }

    /* Layer-specific styling */
    .layer-1 .terrain {
      filter: brightness(1.1);
    }

    .layer-2 .terrain {
      filter: brightness(0.9);
    }

    .layer-3 .terrain {
      filter: brightness(0.8);
    }

    /* Add some texture variation */
    .terrain:nth-child(odd)::before {
      background: linear-gradient(170deg, 
        rgba(45, 90, 39, 0.8) 0%,
        rgba(29, 79, 31, 0.9) 60%,
        rgba(29, 79, 31, 1) 100%
      );
    }

    .terrain:nth-child(even)::before {
      background: linear-gradient(190deg, 
        rgba(45, 90, 39, 0.8) 0%,
        rgba(29, 79, 31, 0.9) 40%,
        rgba(29, 79, 31, 1) 100%
      );
    }

    /* Add subtle animation on hover */
    .terrain {
      transition: filter 0.3s ease;
    }

    .terrain:hover {
      filter: brightness(1.1);
    }

    .pokemon-spawn-point {
      position: absolute;
      width: 150px;
      height: 150px;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .wild-pokemon {
      position: absolute;
      width: 150px;
      height: 150px;
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .wild-pokemon.visible {
      transform: translateY(0);
    }

    .wild-pokemon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
    }

    /* Navigation bar */
    .nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      z-index: 1000;
    }

    .nav-arrow {
      font-size: 32px;
      margin: 0 20px;
    }

    /* Ensure video feed is properly sized */
    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Motion tracking styles */
    .motion-indicators {
      position: absolute;
      top: 120px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      padding: 10px;
      z-index: 10;
      width: 120px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    
    .progress-container {
      margin: 5px 0;
    }
    
    .progress-label {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
      font-weight: bold;
    }
    
    .progress-bar {
      width: 100%;
      height: 15px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4CAF50, #8BC34A);
      transition: width 0.3s ease;
    }
    
    .horizontal-fill {
      background: linear-gradient(90deg, #2196F3, #03A9F4);
    }
    
    .motion-direction {
      font-size: 14px;
      margin-top: 5px;
      font-weight: bold;
    }
    
    /* Hide the processing canvas */
    #processingCanvas {
      display: none;
    }
    
    /* Visualization overlay */
    #visualizationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none; /* Allow click-through */
    }
    
    .debug-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      z-index: 10;
    }

    /* Add these styles in the <style> section */
    .success-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(76, 175, 80, 0.9);
      color: white;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      z-index: 1000;
      animation: fadeInOut 3s ease-in-out;
    }

    .wild-pokemon.catchable {
      animation: bounce 1s infinite;
      filter: brightness(1.2);
    }

    .wild-pokemon.catchable:hover {
      transform: scale(1.1) translateY(0);
      cursor: pointer;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      10% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      90% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Timer styles */
    .timer {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 48px;
      font-weight: bold;
      padding: 10px 30px;
      border-radius: 15px;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* Bottom buddy section */
    .buddy-section {
      position: relative;
      grid-area: bottom;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .dirt-path {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: url(#dirtPattern);
      box-shadow: 0 -4px 8px rgba(0,0,0,0.2) inset;
    }

    .dirt-path::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(180deg, 
        rgba(139, 69, 19, 0.4) 0%,
        transparent 100%
      );
    }

    .buddy-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: walkBackAndForth 8s linear infinite;
      z-index: 2;
    }

    .buddy-pokemon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(1);
    }

    @keyframes walkBackAndForth {
      0% { 
        transform: translateX(-150px) scaleX(1); 
      }
      45% { 
        transform: translateX(150px) scaleX(1);
      }
      50% { 
        transform: translateX(150px) scaleX(-1);
      }
      95% { 
        transform: translateX(-150px) scaleX(-1);
      }
      100% { 
        transform: translateX(-150px) scaleX(1);
      }
    }

    /* Tree styling */
    .tree {
      position: absolute;
      width: 150px;
      height: 300px;
      z-index: 1;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
      transition: filter 0.3s ease;
    }

    .tree:hover {
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)) brightness(1.1);
    }

    .layer-1 .tree { transform: scale(1); }
    .layer-2 .tree { transform: scale(0.85); filter: brightness(0.9) drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
    .layer-3 .tree { transform: scale(0.7); filter: brightness(0.8) drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }

    /* Pokeball styles */
    .pokeball {
      position: absolute;
      width: 80px;
      height: 80px;
      display: none;
      z-index: 1001;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .pokeball:hover {
      transform: scale(1.1) !important;
    }

    .pokeball img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .catch-prompt {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      font-size: 24px;
      text-align: center;
      z-index: 1002;
      display: none;
    }

    /* Add settings panel styles */
    .settings-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 300px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      max-height: 80vh;
      overflow-y: auto;
      transform: translateX(310px);
      transition: transform 0.3s ease-in-out;
    }

    .settings-panel.visible {
      transform: translateX(0);
    }

    .settings-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 2001;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    }

    .settings-toggle i {
      font-size: 20px;
      color: #333;
    }

    .settings-group {
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .settings-group:last-child {
      border-bottom: none;
    }

    .settings-group h3 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #333;
    }

    .setting-item {
      margin-bottom: 8px;
    }

    .setting-item label {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .setting-item input, .setting-item select {
      width: 100%;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 12px;
    }

    .setting-item .range-value {
      float: right;
      font-size: 12px;
      font-weight: bold;
    }

    .settings-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .settings-actions button {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }

    .settings-actions .save-btn {
      background: #4CAF50;
      color: white;
    }

    .settings-actions .reset-btn {
      background: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Add SVG definitions at the start of body -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <!-- Bush Pattern -->
      <pattern id="bushPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M30,10 Q45,25 30,40 Q15,25 30,10" fill="#2d5a27"/>
        <path d="M15,15 Q30,30 15,45 Q0,30 15,15" fill="#1d4f1f"/>
        <path d="M45,15 Q60,30 45,45 Q30,30 45,15" fill="#1d4f1f"/>
        <path d="M30,25 Q45,40 30,55 Q15,40 30,25" fill="#2d5a27"/>
      </pattern>

      <!-- Tree Definition -->
      <symbol id="tree" viewBox="0 0 100 200">
        <!-- Tree Trunk -->
        <path d="M45,200 L45,80 C45,75 55,75 55,80 L55,200 Z" fill="#8B4513"/>
        <!-- Tree Foliage -->
        <g class="foliage">
          <path d="M50,20 
                   C80,20 100,50 90,80 
                   C110,80 110,110 90,120
                   C100,150 80,180 50,180
                   C20,180 0,150 10,120
                   C-10,110 -10,80 10,80
                   C0,50 20,20 50,20Z" 
                fill="#2d5a27"/>
          <path d="M50,30
                   C70,30 85,50 80,70
                   C95,70 95,90 80,100
                   C90,120 70,140 50,140
                   C30,140 10,120 20,100
                   C5,90 5,70 20,70
                   C15,50 30,30 50,30Z"
                fill="#1d4f1f"/>
        </g>
      </symbol>

      <!-- Dirt Path Pattern -->
      <pattern id="dirtPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <!-- Base dirt color -->
        <rect width="60" height="60" fill="#8B4513"/>
        <!-- Texture details -->
        <circle cx="15" cy="15" r="2" fill="#654321" opacity="0.7"/>
        <circle cx="45" cy="45" r="3" fill="#654321" opacity="0.6"/>
        <circle cx="30" cy="30" r="2" fill="#8B6B4F" opacity="0.5"/>
        <circle cx="10" cy="50" r="2" fill="#8B6B4F" opacity="0.6"/>
        <circle cx="50" cy="10" r="3" fill="#654321" opacity="0.7"/>
        <!-- Small pebbles -->
        <circle cx="25" cy="45" r="1" fill="#A0522D" opacity="0.6"/>
        <circle cx="40" cy="20" r="1" fill="#A0522D" opacity="0.5"/>
      </pattern>
    </defs>
  </svg>

  <div class="game-container">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="camera-container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="motionCanvas" style="display: none;"></canvas>
      </div>
      <div class="timer" id="timer">60</div>
      <div class="pause-button" id="pauseButton">
        <i class="fas fa-pause"></i>
      </div>
    </div>

    <!-- Forest scene -->
    <div class="forest-scene" data-component="forest">
      <div class="terrain-layer layer-3" data-layer="3">
        <div class="terrain" data-position="back-left">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="back-left"></div>
        </div>
        <div class="terrain" data-position="back-right">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="back-right"></div>
        </div>
      </div>
      <div class="terrain-layer layer-2" data-layer="2">
        <div class="terrain" data-position="middle-left">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="middle-left"></div>
        </div>
        <div class="terrain" data-position="middle-center">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="middle-center"></div>
        </div>
        <div class="terrain" data-position="middle-right">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="middle-right"></div>
        </div>
      </div>
      <div class="terrain-layer layer-1" data-layer="1">
        <div class="terrain" data-position="front-left">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="front-left"></div>
        </div>
        <div class="terrain" data-position="front-right">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point" data-spawn-point="front-right"></div>
        </div>
      </div>
    </div>

    <!-- Bottom buddy section -->
    <div class="buddy-section" data-component="buddy">
      <div class="dirt-path" data-element="path"></div>
      <div class="buddy-container" data-element="container">
        <img id="buddySprite" src="/static/images/default_buddy.png" alt="Buddy Pokemon" class="buddy-pokemon" data-element="sprite">
      </div>
    </div>
  </div>

  <!-- Make sure we have Font Awesome for the pause icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Add Pokeball and catch prompt elements -->
  <div class="catch-prompt" id="catchPrompt">
    Click the Pokeball to try catching a Pokémon!
  </div>
  <div class="pokeball" id="pokeball">
    <img src="/static/images/pokeball.png" alt="Pokeball">
  </div>

  <!-- Settings Panel -->
  <div class="settings-toggle" id="settingsToggle">
    <i class="fas fa-cog"></i>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <h2>Settings</h2>
    
    <div class="settings-group">
      <h3>Game Settings</h3>
      <div class="setting-item">
        <label for="defaultCountdown">Timer (seconds) <span class="range-value" id="defaultCountdownValue">60</span></label>
        <input type="range" id="defaultCountdown" min="10" max="120" step="10" value="60">
      </div>
    </div>
    
    <div class="settings-group">
      <h3>Pokémon Settings</h3>
      <div class="setting-item">
        <label for="spawnChance">Spawn Chance <span class="range-value" id="spawnChanceValue">0.4</span></label>
        <input type="range" id="spawnChance" min="0.1" max="1" step="0.1" value="0.4">
      </div>
      <div class="setting-item">
        <label for="spawnCooldownMs">Spawn Cooldown (ms) <span class="range-value" id="spawnCooldownMsValue">2000</span></label>
        <input type="range" id="spawnCooldownMs" min="500" max="5000" step="500" value="2000">
      </div>
      <div class="setting-item">
        <label for="pokemonVisibilityMs">Visibility Duration (ms) <span class="range-value" id="pokemonVisibilityMsValue">3000</span></label>
        <input type="range" id="pokemonVisibilityMs" min="1000" max="10000" step="1000" value="3000">
      </div>
    </div>
    
    <div class="settings-group">
      <h3>Motion Settings</h3>
      <div class="setting-item">
        <label for="motionThreshold">Motion Threshold <span class="range-value" id="motionThresholdValue">30</span></label>
        <input type="range" id="motionThreshold" min="10" max="50" step="5" value="30">
      </div>
      <div class="setting-item">
        <label for="maxMotionCount">Max Motion Count <span class="range-value" id="maxMotionCountValue">100</span></label>
        <input type="range" id="maxMotionCount" min="50" max="200" step="10" value="100">
      </div>
    </div>
    
    <div class="settings-group">
      <h3>Catch Settings</h3>
      <div class="setting-item">
        <label for="baseCatchRate">Base Catch Rate (%) <span class="range-value" id="baseCatchRateValue">50</span></label>
        <input type="range" id="baseCatchRate" min="10" max="90" step="5" value="50">
      </div>
      <div class="setting-item">
        <label for="motionBoostMax">Motion Boost Max (%) <span class="range-value" id="motionBoostMaxValue">50</span></label>
        <input type="range" id="motionBoostMax" min="10" max="90" step="5" value="50">
      </div>
    </div>
    
    <div class="settings-group">
      <h3>Animation Settings</h3>
      <div class="setting-item">
        <label for="buddyWalkDurationSec">Buddy Walk Duration (sec) <span class="range-value" id="buddyWalkDurationSecValue">8</span></label>
        <input type="range" id="buddyWalkDurationSec" min="4" max="20" step="1" value="8">
      </div>
    </div>
    
    <div class="settings-actions">
      <button class="save-btn" id="saveSettings">Apply Changes</button>
      <button class="reset-btn" id="resetSettings">Reset to Defaults</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Configuration object for easy parameter adjustment
      const CONFIG = {
        // Game settings
        defaultCountdown: 60,
        // Pokemon settings
        spawnChance: 0.4,
        spawnCooldownMs: 2000,
        pokemonVisibilityMs: 3000,
        // Motion settings
        motionThreshold: 30,
        maxMotionCount: 100,
        historyLength: 10,
        // Camera settings
        cameraWidth: 640,
        cameraHeight: 480,
        // Catch settings
        baseCatchRate: 50,
        motionBoostMax: 50,
        successMessageDurationMs: 3000,
        // Animation settings
        buddyWalkDurationSec: 8,
        buddyWalkDistancePx: 150,
        pokemonBounceHeightPx: 10,
        pokemonBounceRateSec: 1
      };
      
      // Settings Panel Component
      const SettingsPanel = {
        element: document.getElementById('settingsPanel'),
        toggle: document.getElementById('settingsToggle'),
        saveButton: document.getElementById('saveSettings'),
        resetButton: document.getElementById('resetSettings'),
        
        init() {
          // Set initial values
          this.updateAllDisplays();
          
          // Set up event listeners
          this.toggle.addEventListener('click', () => this.toggleVisibility());
          this.saveButton.addEventListener('click', () => this.saveSettings());
          this.resetButton.addEventListener('click', () => this.resetSettings());
          
          // Set up range input listeners
          document.querySelectorAll('.settings-panel input[type="range"]').forEach(input => {
            input.addEventListener('input', (e) => {
              const valueDisplay = document.getElementById(`${e.target.id}Value`);
              if (valueDisplay) {
                valueDisplay.textContent = e.target.value;
              }
            });
          });
        },
        
        toggleVisibility() {
          this.element.classList.toggle('visible');
        },
        
        updateAllDisplays() {
          // Update all range displays with current CONFIG values
          Object.keys(CONFIG).forEach(key => {
            const input = document.getElementById(key);
            const display = document.getElementById(`${key}Value`);
            if (input && display) {
              input.value = CONFIG[key];
              display.textContent = CONFIG[key];
            }
          });
        },
        
        saveSettings() {
          // Save all values from inputs to CONFIG
          Object.keys(CONFIG).forEach(key => {
            const input = document.getElementById(key);
            if (input) {
              CONFIG[key] = parseFloat(input.value);
            }
          });
          
          // Apply certain settings immediately
          if (Components.Buddy) {
            Components.Buddy.setWalkSpeed(CONFIG.buddyWalkDurationSec);
          }
          
          // Update constants
          window.MOTION_THRESHOLD = CONFIG.motionThreshold;
          window.MAX_MOTION_COUNT = CONFIG.maxMotionCount;
          window.HISTORY_LENGTH = CONFIG.historyLength;
          
          console.log('Settings saved:', CONFIG);
          this.showNotification('Settings applied!');
        },
        
        resetSettings() {
          // Reset to default values
          CONFIG.defaultCountdown = 60;
          CONFIG.spawnChance = 0.4;
          CONFIG.spawnCooldownMs = 2000;
          CONFIG.pokemonVisibilityMs = 3000;
          CONFIG.motionThreshold = 30;
          CONFIG.maxMotionCount = 100;
          CONFIG.historyLength = 10;
          CONFIG.baseCatchRate = 50;
          CONFIG.motionBoostMax = 50;
          CONFIG.buddyWalkDurationSec = 8;
          
          // Update displays
          this.updateAllDisplays();
          
          // Apply settings
          this.saveSettings();
          
          console.log('Settings reset to defaults');
          this.showNotification('Settings reset to defaults!');
        },
        
        showNotification(message) {
          const notification = document.createElement('div');
          notification.textContent = message;
          notification.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 3000;
          `;
          
          document.body.appendChild(notification);
          
          setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s ease';
            setTimeout(() => notification.remove(), 500);
          }, 1500);
        }
      };
      
      // Component system for better element control
      const Components = {
        // Top Bar Component
        TopBar: {
          element: document.querySelector('.top-bar'),
          timer: document.getElementById('timer'),
          pauseButton: document.getElementById('pauseButton'),
          camera: {
            container: document.querySelector('.camera-container'),
            video: document.getElementById('videoElement'),
            canvas: document.getElementById('motionCanvas')
          },
          
          updateTimer(value) {
            this.timer.textContent = value;
          },
          
          togglePause(isPaused) {
            const icon = this.pauseButton.querySelector('i');
            if (isPaused) {
              icon.classList.remove('fa-pause');
              icon.classList.add('fa-play');
            } else {
              icon.classList.remove('fa-play');
              icon.classList.add('fa-pause');
            }
          },
          
          hideElement() {
            this.element.style.opacity = '0';
            this.element.style.pointerEvents = 'none';
          },
          
          showElement() {
            this.element.style.opacity = '1';
            this.element.style.pointerEvents = 'auto';
          }
        },
        
        // Forest Scene Component
        Forest: {
          element: document.querySelector('[data-component="forest"]'),
          layers: {
            front: document.querySelector('[data-layer="1"]'),
            middle: document.querySelector('[data-layer="2"]'),
            back: document.querySelector('[data-layer="3"]')
          },
          spawnPoints: {
            getAll() {
              return document.querySelectorAll('.pokemon-spawn-point');
            },
            getByPosition(position) {
              return document.querySelector(`[data-spawn-point="${position}"]`);
            },
            getAvailable() {
              const points = this.getAll();
              return Array.from(points).filter(point => !point.querySelector('.wild-pokemon'));
            },
            getRandomAvailable() {
              const available = this.getAvailable();
              if (available.length === 0) return null;
              return available[Math.floor(Math.random() * available.length)];
            }
          },
          
          addPokemon(spawnPoint, pokemon, isCatchable = false) {
            const pokemonEl = document.createElement('div');
            pokemonEl.className = 'wild-pokemon';
            if (isCatchable) pokemonEl.classList.add('catchable');
            pokemonEl.innerHTML = `<img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">`;
            
            spawnPoint.appendChild(pokemonEl);
            
            // Trigger animation after small delay
            setTimeout(() => {
              pokemonEl.classList.add('visible');
            }, 100);
            
            return pokemonEl;
          },
          
          removePokemon(pokemonEl) {
            pokemonEl.classList.remove('visible');
            setTimeout(() => {
              if (pokemonEl && pokemonEl.parentNode) {
                pokemonEl.remove();
              }
            }, 500);
          },
          
          setVisibility(isVisible) {
            this.element.style.opacity = isVisible ? '1' : '0';
          }
        },
        
        // Buddy Component
        Buddy: {
          element: document.querySelector('[data-component="buddy"]'),
          container: document.querySelector('[data-element="container"]'),
          sprite: document.getElementById('buddySprite'),
          
          setSprite(spriteUrl) {
            this.sprite.src = spriteUrl;
          },
          
          setWalkSpeed(durationSec) {
            this.container.style.animationDuration = `${durationSec}s`;
          },
          
          pauseWalking(isPaused) {
            this.container.style.animationPlayState = isPaused ? 'paused' : 'running';
          },
          
          show() {
            this.element.style.display = 'flex';
          },
          
          hide() {
            this.element.style.display = 'none';
          }
        },
        
        // Catch Mechanics Component
        CatchMechanics: {
          prompt: document.getElementById('catchPrompt'),
          pokeball: document.getElementById('pokeball'),
          
          showPrompt() {
            this.prompt.style.display = 'block';
          },
          
          hidePrompt() {
            this.prompt.style.display = 'none';
          },
          
          showPokeball(top = '70%', left = '50%') {
            this.pokeball.style.display = 'block';
            this.pokeball.style.position = 'fixed';
            this.pokeball.style.top = top;
            this.pokeball.style.left = left;
            this.pokeball.style.transform = 'translate(-50%, -50%)';
          },
          
          hidePokeball() {
            this.pokeball.style.display = 'none';
          },
          
          animatePokeballThrow() {
            this.pokeball.style.transition = 'all 0.5s ease-in-out';
            this.pokeball.style.transform = 'translate(-50%, -50%) scale(0.8) rotate(360deg)';
          },
          
          async animatePokeballShake() {
            for (let i = 0; i < 3; i++) {
              await new Promise(resolve => {
                setTimeout(() => {
                  this.pokeball.style.transform = 'translate(-50%, -50%) scale(0.8) rotate(20deg)';
                  setTimeout(() => {
                    this.pokeball.style.transform = 'translate(-50%, -50%) scale(0.8) rotate(-20deg)';
                    resolve();
                  }, 250);
                }, 250);
              });
            }
          }
        }
      };
      
      // State variables
      let countdown = CONFIG.defaultCountdown;
      let activeProfile = null;
      let totalMotion = 0;
      let canCatch = false;
      let catchablePokemon = null;
      let isPaused = false;
      let previousPixels = null;
      let horizontalMotionCount = 0;
      let verticalMotionCount = 0;
      let motionHistory = [];
      let motionVectors = [];
      let spawnCooldown = false;

      // Constants (now using CONFIG)
      const MOTION_THRESHOLD = CONFIG.motionThreshold;
      const MAX_MOTION_COUNT = CONFIG.maxMotionCount;
      const HISTORY_LENGTH = CONFIG.historyLength;

      // DOM Elements (now using Components)
      const timerElement = Components.TopBar.timer;
      const pauseButton = Components.TopBar.pauseButton;
      const videoElement = Components.TopBar.camera.video;
      const motionCanvas = Components.TopBar.camera.canvas;
      const context = motionCanvas.getContext('2d');
      
      // Set canvas dimensions from CONFIG
      motionCanvas.width = CONFIG.cameraWidth;
      motionCanvas.height = CONFIG.cameraHeight;

      // Load active profile and start game
      async function loadActiveProfile() {
        try {
          const response = await fetch('/api/active_profile');
          if (response.ok) {
            activeProfile = await response.json();
            console.log('Active profile:', activeProfile);
            countdown = activeProfile.brushing_time || CONFIG.defaultCountdown;
            console.log('Setting countdown to:', countdown);
            
            // Set buddy sprite if available
            if (activeProfile.buddy_pokemon) {
              Components.Buddy.setSprite(activeProfile.buddy_pokemon.sprite);
            }
          } else {
            console.warn('No active profile found, using default time');
          }
        } catch (error) {
          console.error('Error loading active profile:', error);
        }
      }

      // Timer functionality
      function startBrushingTimer() {
        console.log('Starting timer with countdown:', countdown);
        
        const timer = setInterval(() => {
          if (isPaused) return;
          
          countdown--;
          Components.TopBar.updateTimer(countdown);
          
          if (countdown <= 0) {
            clearInterval(timer);
            console.log('Timer complete! Motion stats:', {
              horizontalMotion: horizontalMotionCount,
              verticalMotion: verticalMotionCount,
              totalMotion
            });
            
            // Show catch elements using Components
            Components.CatchMechanics.showPrompt();
            Components.CatchMechanics.showPokeball();
            
            // Add click handler for Pokeball
            Components.CatchMechanics.pokeball.onclick = async () => {
              if (!catchablePokemon) return;
              
              // Calculate catch rate based on total motion
              const catchRate = CONFIG.baseCatchRate + (totalMotion / MAX_MOTION_COUNT) * CONFIG.motionBoostMax;
              await tryToCatch(catchablePokemon, catchRate);
            };
            
            // Enable catching
            canCatch = true;
            
            // Ensure a Pokemon is available to catch
            const spawnPoint = Components.Forest.spawnPoints.getRandomAvailable();
            if (spawnPoint) {
              spawnPokemon(spawnPoint, true);
            }
          }
        }, 1000);
      }

      // Pause button functionality using Components
      if (pauseButton) {
        pauseButton.addEventListener('click', () => {
          isPaused = !isPaused;
          Components.TopBar.togglePause(isPaused);
          Components.Buddy.pauseWalking(isPaused);
          
          if (isPaused) {
            videoElement.pause();
          } else {
            videoElement.play();
          }
        });
      }

      async function initPokemonSpawning() {
        console.log('Found spawn points:', Components.Forest.spawnPoints.getAll().length);
        
        let spawnInterval = setInterval(async () => {
          if (isPaused || spawnCooldown) return;

          if (Math.random() < CONFIG.spawnChance) {
            spawnCooldown = true;
            setTimeout(() => { spawnCooldown = false; }, CONFIG.spawnCooldownMs);

            const spawnPoint = Components.Forest.spawnPoints.getRandomAvailable();
            if (spawnPoint) {
              await spawnPokemon(spawnPoint);
            }
          }
        }, 1000);

        setTimeout(() => {
          clearInterval(spawnInterval);
        }, countdown * 1000);
      }

      async function spawnPokemon(spawnPoint, isCatchTarget = false) {
        try {
          const id = Math.floor(Math.random() * 151) + 1;
          const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
          const pokemon = await response.json();

          // Use the Component system to add Pokemon
          const pokemonEl = Components.Forest.addPokemon(spawnPoint, pokemon, isCatchTarget);
          
          if (isCatchTarget) {
            catchablePokemon = pokemon;
          } else {
            setTimeout(() => {
              Components.Forest.removePokemon(pokemonEl);
            }, CONFIG.pokemonVisibilityMs);
          }
        } catch (error) {
          console.error('Error spawning Pokemon:', error);
        }
      }

      async function tryToCatch(pokemon, catchRate) {
        // Use Components to animate the Pokeball
        Components.CatchMechanics.animatePokeballThrow();
        await Components.CatchMechanics.animatePokeballShake();
        
        const caught = Math.random() * 100 < catchRate;
        
        if (caught) {
          try {
            const response = await fetch('/api/catch_pokemon', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                pokemon_id: pokemon.id,
                name: pokemon.name,
                sprite: pokemon.sprites.front_default
              })
            });
            
            if (response.ok) {
              showSuccessMessage(`Caught ${pokemon.name}!`);
              
              // Hide the caught Pokemon
              const wildPokemon = document.querySelector('.wild-pokemon.catchable');
              if (wildPokemon) {
                Components.Forest.removePokemon(wildPokemon);
              }
            }
          } catch (error) {
            console.error('Error saving caught Pokemon:', error);
          }
        } else {
          showSuccessMessage(`${pokemon.name} got away!`);
        }
        
        // Wait for message to show before redirecting
        setTimeout(() => {
          window.location.href = '/results';
        }, CONFIG.successMessageDurationMs);
      }

      // Initialize the brushing application
      async function initBrushingApp() {
        await loadActiveProfile();
        await startCamera();
        startBrushingTimer();
        playBackgroundMusic();
        initForestScene();
        
        // Set buddy walk speed from config
        Components.Buddy.setWalkSpeed(CONFIG.buddyWalkDurationSec);
        
        // Initialize settings panel after everything else is ready
        SettingsPanel.init();
      }

      function initForestScene() {
        initPokemonSpawning();
      }

      function detectHandMotion() {
        if (!videoElement || videoElement.paused) return;
        
        // Draw current video frame
        context.drawImage(videoElement, 0, 0, motionCanvas.width, motionCanvas.height);
        
        // Get current frame data
        const currentPixels = context.getImageData(
          motionCanvas.width * 0.25, // Start at 25% from left
          motionCanvas.height * 0.25, // Start at 25% from top
          motionCanvas.width * 0.5, // Use middle 50% width
          motionCanvas.height * 0.5 // Use middle 50% height
        ).data;
        
        if (previousPixels) {
          const { horizontalMotion, verticalMotion } = calculateMotion(currentPixels, previousPixels);
          updateMotionTracking({ horizontalMotion, verticalMotion });
        }
        
        previousPixels = currentPixels;
        requestAnimationFrame(detectHandMotion);
      }

      function calculateMotion(currentData, previousData) {
        let horizontalMotion = 0;
        let verticalMotion = 0;
        
        // Calculate pixel differences in central region
        for (let i = 0; i < currentData.length; i += 4) {
          const rDiff = Math.abs(currentData[i] - previousData[i]);
          const gDiff = Math.abs(currentData[i + 1] - previousData[i + 1]);
          const bDiff = Math.abs(currentData[i + 2] - previousData[i + 2]);
          
          // Average RGB differences
          const pixelDiff = (rDiff + gDiff + bDiff) / 3;
          
          if (pixelDiff > MOTION_THRESHOLD) {
            // Determine if motion is more horizontal or vertical
            const x = (i / 4) % (motionCanvas.width * 0.5);
            const y = Math.floor((i / 4) / (motionCanvas.width * 0.5));
            
            if (x < motionCanvas.width * 0.25) {
              horizontalMotion++;
            } else {
              verticalMotion++;
            }
          }
        }
        
        return { horizontalMotion, verticalMotion };
      }

      function updateMotionTracking({ horizontalMotion, verticalMotion }) {
        // Update motion counts
        if (horizontalMotion > MOTION_THRESHOLD) {
          horizontalMotionCount = Math.min(horizontalMotionCount + 1, MAX_MOTION_COUNT);
        }
        
        if (verticalMotion > MOTION_THRESHOLD) {
          verticalMotionCount = Math.min(verticalMotionCount + 1, MAX_MOTION_COUNT);
        }
        
        // Update motion history
        motionHistory.push({ horizontalMotion, verticalMotion });
        if (motionHistory.length > HISTORY_LENGTH) {
          motionHistory.shift();
        }
        
        // Calculate average motion
        const avgMotion = motionHistory.reduce((sum, motion) => {
          return {
            horizontalMotion: sum.horizontalMotion + motion.horizontalMotion,
            verticalMotion: sum.verticalMotion + motion.verticalMotion
          };
        }, { horizontalMotion: 0, verticalMotion: 0 });
        
        avgMotion.horizontalMotion /= motionHistory.length;
        avgMotion.verticalMotion /= motionHistory.length;
        
        // Update total motion for catch rate
        totalMotion = Math.min(
          totalMotion + (avgMotion.horizontalMotion + avgMotion.verticalMotion) / 2,
          MAX_MOTION_COUNT
        );
      }

      function playBackgroundMusic() {
        const musicCount = 7;
        const trackNumber = Math.floor(Math.random() * musicCount) + 1;
        const audioSrc = window.location.origin + `/static/music/BGM Stage 0${trackNumber}.mp3`;
        console.log("Loading music from:", audioSrc);
        const audio = new Audio(audioSrc);
        audio.loop = true;
        audio.volume = 0.6;
        audio.play().catch(e => console.warn("Music autoplay blocked:", e));
      }

      // Initialize camera
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              width: CONFIG.cameraWidth,
              height: CONFIG.cameraHeight,
              facingMode: 'user'
            } 
          });
          
          videoElement.srcObject = stream;
          await videoElement.play();
          
          // Start motion detection
          detectHandMotion();
          
        } catch (error) {
          console.error('Error accessing camera:', error);
          alert('Please allow camera access to play!');
        }
      }

      function showSuccessMessage(message) {
        const messageEl = document.createElement('div');
        messageEl.className = 'success-message';
        messageEl.textContent = message;
        document.body.appendChild(messageEl);
        setTimeout(() => messageEl.remove(), CONFIG.successMessageDurationMs);
      }

      // Start the application
      initBrushingApp();
    });
  </script>
</body>
</html>
