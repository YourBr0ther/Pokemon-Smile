<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brushing - Pokémon Smile</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  
  {% include 'common_head.html' %}
  <style>
    /* Layout containers */
    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #4682B4 100%);
    }

    /* Top bar elements */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .camera-container {
      width: 240px;
      height: 180px;
      border: 4px solid white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #000;
    }

    .timer {
      font-size: 48px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 30px;
      border-radius: 25px;
    }

    .pause-button {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .pause-button i {
      font-size: 24px;
      color: #333;
    }

    /* Forest scene */
    .forest-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .terrain-layer {
      position: absolute;
      width: 100%;
      height: 40%;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
    }

    .layer-1 { bottom: 25%; }
    .layer-2 { bottom: 15%; }
    .layer-3 { bottom: 10%; }

    .terrain {
      position: relative;
      width: 33%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .terrain::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, 
        rgba(45, 90, 39, 0.8) 0%,
        rgba(29, 79, 31, 0.9) 50%,
        rgba(29, 79, 31, 1) 100%
      );
      border-radius: 50% 50% 0 0;
    }

    .terrain::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      bottom: 0;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0) 70%
      );
      border-radius: 50% 50% 0 0;
    }

    /* Layer-specific styling */
    .layer-1 .terrain {
      filter: brightness(1.1);
    }

    .layer-2 .terrain {
      filter: brightness(0.9);
    }

    .layer-3 .terrain {
      filter: brightness(0.8);
    }

    /* Add some texture variation */
    .terrain:nth-child(odd)::before {
      background: linear-gradient(170deg, 
        rgba(45, 90, 39, 0.8) 0%,
        rgba(29, 79, 31, 0.9) 60%,
        rgba(29, 79, 31, 1) 100%
      );
    }

    .terrain:nth-child(even)::before {
      background: linear-gradient(190deg, 
        rgba(45, 90, 39, 0.8) 0%,
        rgba(29, 79, 31, 0.9) 40%,
        rgba(29, 79, 31, 1) 100%
      );
    }

    /* Add subtle animation on hover */
    .terrain {
      transition: filter 0.3s ease;
    }

    .terrain:hover {
      filter: brightness(1.1);
    }

    .pokemon-spawn-point {
      position: absolute;
      width: 150px;
      height: 150px;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .wild-pokemon {
      position: absolute;
      width: 150px;
      height: 150px;
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .wild-pokemon.visible {
      transform: translateY(0);
    }

    .wild-pokemon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
    }

    /* Navigation bar */
    .nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      z-index: 1000;
    }

    .nav-arrow {
      font-size: 32px;
      margin: 0 20px;
    }

    /* Ensure video feed is properly sized */
    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Motion tracking styles */
    .motion-indicators {
      position: absolute;
      top: 120px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      padding: 10px;
      z-index: 10;
      width: 120px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    
    .progress-container {
      margin: 5px 0;
    }
    
    .progress-label {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
      font-weight: bold;
    }
    
    .progress-bar {
      width: 100%;
      height: 15px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4CAF50, #8BC34A);
      transition: width 0.3s ease;
    }
    
    .horizontal-fill {
      background: linear-gradient(90deg, #2196F3, #03A9F4);
    }
    
    .motion-direction {
      font-size: 14px;
      margin-top: 5px;
      font-weight: bold;
    }
    
    /* Hide the processing canvas */
    #processingCanvas {
      display: none;
    }
    
    /* Visualization overlay */
    #visualizationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none; /* Allow click-through */
    }
    
    .debug-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      z-index: 10;
    }

    /* Add these styles in the <style> section */
    .success-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(76, 175, 80, 0.9);
      color: white;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      z-index: 1000;
      animation: fadeInOut 3s ease-in-out;
    }

    .wild-pokemon.catchable {
      animation: bounce 1s infinite;
      filter: brightness(1.2);
    }

    .wild-pokemon.catchable:hover {
      transform: scale(1.1) translateY(0);
      cursor: pointer;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      10% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      90% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Timer styles */
    .timer {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 48px;
      font-weight: bold;
      padding: 10px 30px;
      border-radius: 15px;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* Bottom buddy section */
    .buddy-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .dirt-path {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: url(#dirtPattern);
      box-shadow: 0 -4px 8px rgba(0,0,0,0.2) inset;
    }

    .dirt-path::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(180deg, 
        rgba(139, 69, 19, 0.4) 0%,
        transparent 100%
      );
    }

    .buddy-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: walkBackAndForth 8s linear infinite;
      z-index: 2;
    }

    .buddy-pokemon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(1);
    }

    @keyframes walkBackAndForth {
      0% { 
        transform: translateX(-150px) scaleX(1); 
      }
      45% { 
        transform: translateX(150px) scaleX(1);
      }
      50% { 
        transform: translateX(150px) scaleX(-1);
      }
      95% { 
        transform: translateX(-150px) scaleX(-1);
      }
      100% { 
        transform: translateX(-150px) scaleX(1);
      }
    }

    /* Tree styling */
    .tree {
      position: absolute;
      width: 150px;
      height: 300px;
      z-index: 1;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
      transition: filter 0.3s ease;
    }

    .tree:hover {
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)) brightness(1.1);
    }

    .layer-1 .tree { transform: scale(1); }
    .layer-2 .tree { transform: scale(0.85); filter: brightness(0.9) drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
    .layer-3 .tree { transform: scale(0.7); filter: brightness(0.8) drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }

    /* Pokeball styles */
    .pokeball {
      position: absolute;
      width: 80px;
      height: 80px;
      display: none;
      z-index: 1001;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .pokeball:hover {
      transform: scale(1.1) !important;
    }

    .pokeball img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .catch-prompt {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      font-size: 24px;
      text-align: center;
      z-index: 1002;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Add SVG definitions at the start of body -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <!-- Bush Pattern -->
      <pattern id="bushPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M30,10 Q45,25 30,40 Q15,25 30,10" fill="#2d5a27"/>
        <path d="M15,15 Q30,30 15,45 Q0,30 15,15" fill="#1d4f1f"/>
        <path d="M45,15 Q60,30 45,45 Q30,30 45,15" fill="#1d4f1f"/>
        <path d="M30,25 Q45,40 30,55 Q15,40 30,25" fill="#2d5a27"/>
      </pattern>

      <!-- Tree Definition -->
      <symbol id="tree" viewBox="0 0 100 200">
        <!-- Tree Trunk -->
        <path d="M45,200 L45,80 C45,75 55,75 55,80 L55,200 Z" fill="#8B4513"/>
        <!-- Tree Foliage -->
        <g class="foliage">
          <path d="M50,20 
                   C80,20 100,50 90,80 
                   C110,80 110,110 90,120
                   C100,150 80,180 50,180
                   C20,180 0,150 10,120
                   C-10,110 -10,80 10,80
                   C0,50 20,20 50,20Z" 
                fill="#2d5a27"/>
          <path d="M50,30
                   C70,30 85,50 80,70
                   C95,70 95,90 80,100
                   C90,120 70,140 50,140
                   C30,140 10,120 20,100
                   C5,90 5,70 20,70
                   C15,50 30,30 50,30Z"
                fill="#1d4f1f"/>
        </g>
      </symbol>

      <!-- Dirt Path Pattern -->
      <pattern id="dirtPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
        <!-- Base dirt color -->
        <rect width="60" height="60" fill="#8B4513"/>
        <!-- Texture details -->
        <circle cx="15" cy="15" r="2" fill="#654321" opacity="0.7"/>
        <circle cx="45" cy="45" r="3" fill="#654321" opacity="0.6"/>
        <circle cx="30" cy="30" r="2" fill="#8B6B4F" opacity="0.5"/>
        <circle cx="10" cy="50" r="2" fill="#8B6B4F" opacity="0.6"/>
        <circle cx="50" cy="10" r="3" fill="#654321" opacity="0.7"/>
        <!-- Small pebbles -->
        <circle cx="25" cy="45" r="1" fill="#A0522D" opacity="0.6"/>
        <circle cx="40" cy="20" r="1" fill="#A0522D" opacity="0.5"/>
      </pattern>
    </defs>
  </svg>

  <div class="game-container">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="camera-container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="motionCanvas" style="display: none;"></canvas>
      </div>
      <div class="timer" id="timer">60</div>
      <div class="pause-button" id="pauseButton">
        <i class="fas fa-pause"></i>
      </div>
    </div>

    <!-- Forest scene -->
    <div class="forest-scene">
      <div class="terrain-layer layer-3">
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
      </div>
      <div class="terrain-layer layer-2">
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
      </div>
      <div class="terrain-layer layer-1">
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
        <div class="terrain">
          <svg class="tree" viewBox="0 0 100 200">
            <use href="#tree"/>
          </svg>
          <div class="pokemon-spawn-point"></div>
        </div>
      </div>
    </div>

    <!-- Bottom buddy section -->
    <div class="buddy-section">
      <div class="dirt-path"></div>
      <div class="buddy-container">
        <img id="buddySprite" src="/static/images/default_buddy.png" alt="Buddy Pokemon" class="buddy-pokemon">
      </div>
    </div>
  </div>

  <!-- Make sure we have Font Awesome for the pause icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Add Pokeball and catch prompt elements -->
  <div class="catch-prompt" id="catchPrompt">
    Click the Pokeball to try catching a Pokémon!
  </div>
  <div class="pokeball" id="pokeball">
    <img src="/static/images/pokeball.png" alt="Pokeball">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // State variables
      let countdown = 60;
      let activeProfile = null;
      let totalMotion = 0;
      let canCatch = false;
      let catchablePokemon = null;
      let isPaused = false;
      let previousPixels = null;
      let horizontalMotionCount = 0;
      let verticalMotionCount = 0;
      let motionHistory = [];
      let motionVectors = [];
      let spawnCooldown = false;

      // Constants
      const MOTION_THRESHOLD = 30;
      const MAX_MOTION_COUNT = 100;
      const HISTORY_LENGTH = 10;

      // DOM Elements
      const timerElement = document.getElementById('timer');
      const pauseButton = document.getElementById('pauseButton');
      const videoElement = document.getElementById('videoElement');
      const motionCanvas = document.getElementById('motionCanvas');
      const context = motionCanvas.getContext('2d');
      
      // Set canvas dimensions
      motionCanvas.width = 640;
      motionCanvas.height = 480;

      // Load active profile and start game
      async function loadActiveProfile() {
        try {
          const response = await fetch('/api/active_profile');
          if (response.ok) {
            activeProfile = await response.json();
            console.log('Active profile:', activeProfile);
            countdown = activeProfile.brushing_time || 60;
            console.log('Setting countdown to:', countdown);
          } else {
            console.warn('No active profile found, using default time');
          }
        } catch (error) {
          console.error('Error loading active profile:', error);
        }
      }

      // Initialize camera
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              width: 640,
              height: 480,
              facingMode: 'user'
            } 
          });
          
          videoElement.srcObject = stream;
          await videoElement.play();
          
          // Start motion detection
          detectHandMotion();
          
        } catch (error) {
          console.error('Error accessing camera:', error);
          alert('Please allow camera access to play!');
        }
      }

      // Timer functionality
      function startBrushingTimer() {
        console.log('Starting timer with countdown:', countdown);
        
        const timer = setInterval(() => {
          if (isPaused) return;
          
          countdown--;
          timerElement.textContent = countdown;
          
          if (countdown <= 0) {
            clearInterval(timer);
            console.log('Timer complete! Motion stats:', {
              horizontalMotion: horizontalMotionCount,
              verticalMotion: verticalMotionCount,
              totalMotion
            });
            
            // Show catch prompt
            const catchPrompt = document.getElementById('catchPrompt');
            catchPrompt.style.display = 'block';
            
            // Show and position Pokeball
            const pokeball = document.getElementById('pokeball');
            pokeball.style.display = 'block';
            pokeball.style.position = 'fixed';
            pokeball.style.top = '70%';
            pokeball.style.left = '50%';
            pokeball.style.transform = 'translate(-50%, -50%)';
            
            // Add click handler for Pokeball
            pokeball.onclick = async () => {
              if (!catchablePokemon) return;
              
              // Calculate catch rate based on total motion (50% base + up to 50% from motion)
              const catchRate = 50 + (totalMotion / MAX_MOTION_COUNT) * 50;
              await tryToCatch(catchablePokemon, catchRate);
            };
            
            // Enable catching
            canCatch = true;
            
            // Ensure a Pokemon is available to catch
            const spawnPoints = document.querySelectorAll('.pokemon-spawn-point');
            const availablePoint = Array.from(spawnPoints).find(point => !point.querySelector('.wild-pokemon'));
            if (availablePoint) {
              spawnPokemon(availablePoint, true);
            }
          }
        }, 1000);
      }

      // Pause button functionality
      if (pauseButton) {
        pauseButton.addEventListener('click', () => {
          isPaused = !isPaused;
          pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
          
          if (isPaused) {
            videoElement.pause();
          } else {
            videoElement.play();
          }
        });
      }

      // Initialize the brushing application
      async function initBrushingApp() {
        await loadActiveProfile();
        await startCamera();
        startBrushingTimer();
        playBackgroundMusic();
        initForestScene();
      }

      function detectHandMotion() {
        if (!videoElement || videoElement.paused) return;
        
        // Draw current video frame
        context.drawImage(videoElement, 0, 0, motionCanvas.width, motionCanvas.height);
        
        // Get current frame data
        const currentPixels = context.getImageData(
          motionCanvas.width * 0.25, // Start at 25% from left
          motionCanvas.height * 0.25, // Start at 25% from top
          motionCanvas.width * 0.5, // Use middle 50% width
          motionCanvas.height * 0.5 // Use middle 50% height
        ).data;
        
        if (previousPixels) {
          const { horizontalMotion, verticalMotion } = calculateMotion(currentPixels, previousPixels);
          updateMotionTracking({ horizontalMotion, verticalMotion });
        }
        
        previousPixels = currentPixels;
        requestAnimationFrame(detectHandMotion);
      }

      function calculateMotion(currentData, previousData) {
        let horizontalMotion = 0;
        let verticalMotion = 0;
        
        // Calculate pixel differences in central region
        for (let i = 0; i < currentData.length; i += 4) {
          const rDiff = Math.abs(currentData[i] - previousData[i]);
          const gDiff = Math.abs(currentData[i + 1] - previousData[i + 1]);
          const bDiff = Math.abs(currentData[i + 2] - previousData[i + 2]);
          
          // Average RGB differences
          const pixelDiff = (rDiff + gDiff + bDiff) / 3;
          
          if (pixelDiff > MOTION_THRESHOLD) {
            // Determine if motion is more horizontal or vertical
            const x = (i / 4) % (motionCanvas.width * 0.5);
            const y = Math.floor((i / 4) / (motionCanvas.width * 0.5));
            
            if (x < motionCanvas.width * 0.25) {
              horizontalMotion++;
            } else {
              verticalMotion++;
            }
          }
        }
        
        return { horizontalMotion, verticalMotion };
      }

      function updateMotionTracking({ horizontalMotion, verticalMotion }) {
        // Update motion counts
        if (horizontalMotion > MOTION_THRESHOLD) {
          horizontalMotionCount = Math.min(horizontalMotionCount + 1, MAX_MOTION_COUNT);
        }
        
        if (verticalMotion > MOTION_THRESHOLD) {
          verticalMotionCount = Math.min(verticalMotionCount + 1, MAX_MOTION_COUNT);
        }
        
        // Update motion history
        motionHistory.push({ horizontalMotion, verticalMotion });
        if (motionHistory.length > HISTORY_LENGTH) {
          motionHistory.shift();
        }
        
        // Calculate average motion
        const avgMotion = motionHistory.reduce((sum, motion) => {
          return {
            horizontalMotion: sum.horizontalMotion + motion.horizontalMotion,
            verticalMotion: sum.verticalMotion + motion.verticalMotion
          };
        }, { horizontalMotion: 0, verticalMotion: 0 });
        
        avgMotion.horizontalMotion /= motionHistory.length;
        avgMotion.verticalMotion /= motionHistory.length;
        
        // Update total motion for catch rate
        totalMotion = Math.min(
          totalMotion + (avgMotion.horizontalMotion + avgMotion.verticalMotion) / 2,
          MAX_MOTION_COUNT
        );
      }

      function playBackgroundMusic() {
        const musicCount = 7;
        const trackNumber = Math.floor(Math.random() * musicCount) + 1;
        const audioSrc = window.location.origin + `/static/music/BGM Stage 0${trackNumber}.mp3`;
        console.log("Loading music from:", audioSrc);
        const audio = new Audio(audioSrc);
        audio.loop = true;
        audio.volume = 0.6;
        audio.play().catch(e => console.warn("Music autoplay blocked:", e));
      }

      function initForestScene() {
        initPokemonSpawning();
      }

      async function initPokemonSpawning() {
        const spawnPoints = document.querySelectorAll('.pokemon-spawn-point');
        console.log('Found spawn points:', spawnPoints.length);
        
        let spawnInterval = setInterval(async () => {
          if (isPaused || spawnCooldown) return;

          if (Math.random() < 0.4) {
            spawnCooldown = true;
            setTimeout(() => { spawnCooldown = false; }, 2000);

            const availablePoints = Array.from(spawnPoints).filter(point => !point.querySelector('.wild-pokemon'));
            if (availablePoints.length > 0) {
              const randomPoint = availablePoints[Math.floor(Math.random() * availablePoints.length)];
              await spawnPokemon(randomPoint);
            }
          }
        }, 1000);

        setTimeout(() => {
          clearInterval(spawnInterval);
        }, countdown * 1000);
      }

      async function spawnPokemon(spawnPoint, isCatchTarget = false) {
        try {
          const id = Math.floor(Math.random() * 151) + 1;
          const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
          const pokemon = await response.json();

          const pokemonEl = document.createElement('div');
          pokemonEl.className = 'wild-pokemon';
          pokemonEl.innerHTML = `<img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">`;
          
          spawnPoint.appendChild(pokemonEl);
          
          setTimeout(() => {
            pokemonEl.classList.add('visible');
          }, 100);

          if (isCatchTarget) {
            catchablePokemon = pokemon;
            pokemonEl.classList.add('catchable');
          } else {
            setTimeout(() => {
              if (pokemonEl && pokemonEl.parentNode) {
                pokemonEl.classList.remove('visible');
                setTimeout(() => pokemonEl.remove(), 500);
              }
            }, 3000);
          }
        } catch (error) {
          console.error('Error spawning Pokemon:', error);
        }
      }

      async function tryToCatch(pokemon, catchRate) {
        const pokeball = document.getElementById('pokeball');
        
        // Animate Pokeball throw
        pokeball.style.transition = 'all 0.5s ease-in-out';
        pokeball.style.transform = 'translate(-50%, -50%) scale(0.8) rotate(360deg)';
        
        // Shake animation
        for (let i = 0; i < 3; i++) {
          await new Promise(resolve => {
            setTimeout(() => {
              pokeball.style.transform = 'translate(-50%, -50%) scale(0.8) rotate(20deg)';
              setTimeout(() => {
                pokeball.style.transform = 'translate(-50%, -50%) scale(0.8) rotate(-20deg)';
                resolve();
              }, 250);
            }, 250);
          });
        }
        
        const caught = Math.random() * 100 < catchRate;
        
        if (caught) {
          try {
            const response = await fetch('/api/catch_pokemon', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                pokemon_id: pokemon.id,
                name: pokemon.name,
                sprite: pokemon.sprites.front_default
              })
            });
            
            if (response.ok) {
              showSuccessMessage(`Caught ${pokemon.name}!`);
              
              // Hide the caught Pokemon
              const wildPokemon = document.querySelector('.wild-pokemon.catchable');
              if (wildPokemon) {
                wildPokemon.classList.remove('visible');
                setTimeout(() => wildPokemon.remove(), 500);
              }
            }
          } catch (error) {
            console.error('Error saving caught Pokemon:', error);
          }
        } else {
          showSuccessMessage(`${pokemon.name} got away!`);
        }
        
        // Wait for message to show before redirecting
        setTimeout(() => {
          window.location.href = '/results';
        }, 3000);
      }

      function showSuccessMessage(message) {
        const messageEl = document.createElement('div');
        messageEl.className = 'success-message';
        messageEl.textContent = message;
        document.body.appendChild(messageEl);
        setTimeout(() => messageEl.remove(), 3000);
      }

      // Start the application
      initBrushingApp();
    });
  </script>
</body>
</html>
